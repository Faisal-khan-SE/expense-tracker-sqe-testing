[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Quick critical path smoke tests
    regression: Full regression test suite
    models: Tests targeting expense_tracker.models module
    formatting: Tests targeting expense_tracker.formatting module
    stats: Tests targeting expense_tracker.stats module
    data_driven: Data-driven tests consuming external CSV resources

# Task 4: parallel execution via pytest-xdist (-n auto uses all available CPU cores).
# --dist=loadscope keeps tests in the same class on the same worker to avoid DB conflicts.
# -p no:randomly ensures pytest-order marks are respected.
addopts = -v --strict-markers -n auto --dist=loadscope
