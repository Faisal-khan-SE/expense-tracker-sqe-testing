[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke:       Quick critical-path smoke tests (subset of regression)
    regression:  Full regression suite across all three modules
    models:      Tests targeting expense_tracker.models module
    formatting:  Tests targeting expense_tracker.formatting module
    stats:       Tests targeting expense_tracker.stats module
    data_driven: Data-driven tests consuming tests/data/test_cases.csv

# Default: sequential execution so that pytest-order markers are respected
# and there are no SQLite-concurrency surprises in CI or fresh environments.
#
# To run in parallel (Task 4 — parallel execution):
#   pytest -n auto --dist=loadscope
#
# --dist=loadscope keeps tests in the same class on the same worker, which is
# important for the DB-backed models tests (each class shares one temp DB via
# the `app` fixture scoped to function, but workers must not interleave classes).
#
# NOTE: pytest-order is advisory in parallel mode; class-level ordering is
# preserved within each worker but cross-class order is non-deterministic.
addopts = -v --strict-markers
